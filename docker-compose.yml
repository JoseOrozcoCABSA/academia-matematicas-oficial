name: ${COMPOSE_PROJECT_NAME:-academia-matematicas-final}

x-node-service: &node-service
  restart: unless-stopped
  environment: &service-environment
    NODE_ENV: ${DOCKER_NODE_ENV:-production}
    HOST: ${SERVICE_HOST:-0.0.0.0}
    # La base unica ya tiene una direccion accesible desde host y contenedores.
    # Usar DB_HOST evita redirigir MySQL a la puerta de enlace de Docker.
    DB_HOST: ${MYSQL_HOST_CONTENEDORES:?MYSQL_HOST_CONTENEDORES es obligatorio}
    DB_PORT: ${DB_PORT:-3306}
    DB_NAME: ${DB_NAME:-academia-matematicas-soa}
    DB_USER: ${DB_USER:?DB_USER es obligatorio}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
    INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY es obligatorio}
    JWT_EXPIRES_IN: 8h
  extra_hosts:
    - host.docker.internal:host-gateway
  networks: [academia-math]

services:
  identity-service:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: identity-service }
    environment:
      <<: *service-environment
      PORT: ${IDENTITY_PORT:-4604}
      SERVICE_NAME: identity-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  learning-service:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: learning-service }
    environment:
      <<: *service-environment
      PORT: ${LEARNING_PORT:-4601}
      SERVICE_NAME: learning-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  practice-service:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: practice-service }
    environment:
      <<: *service-environment
      PORT: ${PRACTICE_PORT:-4602}
      SERVICE_NAME: practice-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-service:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: ai-service }
    environment:
      <<: *service-environment
      PORT: ${AI_PORT:-4603}
      SERVICE_NAME: ai-service
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: api-gateway }
    environment:
      NODE_ENV: ${DOCKER_NODE_ENV:-production}
      HOST: ${SERVICE_HOST:-0.0.0.0}
      PORT: ${GATEWAY_PORT:-4600}
      GATEWAY_NAME: ${GATEWAY_NAME:-academia-matematicas-api-gateway}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY es obligatorio}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5176,http://localhost:5177,http://localhost:4610,http://localhost:4611}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      LEARNING_SERVICE_URL: ${LEARNING_DOCKER_SERVICE_URL:?LEARNING_DOCKER_SERVICE_URL es obligatorio}
      PRACTICE_SERVICE_URL: ${PRACTICE_DOCKER_SERVICE_URL:?PRACTICE_DOCKER_SERVICE_URL es obligatorio}
      AI_SERVICE_URL: ${AI_DOCKER_SERVICE_URL:?AI_DOCKER_SERVICE_URL es obligatorio}
      IDENTITY_SERVICE_URL: ${IDENTITY_DOCKER_SERVICE_URL:?IDENTITY_DOCKER_SERVICE_URL es obligatorio}
    depends_on:
      identity-service: { condition: service_healthy }
      learning-service: { condition: service_healthy }
      practice-service: { condition: service_healthy }
      ai-service: { condition: service_healthy }
    ports: ["${GATEWAY_PORT:-4600}:${GATEWAY_PORT:-4600}"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [academia-math]

  frontend-estudiantes:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND: frontend-estudiantes
        VITE_API_URL: ${VITE_STUDENT_API_URL:-}
        VITE_GATEWAY_PORT: ${VITE_GATEWAY_PORT:-}
        VITE_STUDENT_APP_URL: ${VITE_STUDENT_APP_URL:-}
    depends_on:
      api-gateway: { condition: service_healthy }
    ports: ["${STUDENT_DOCKER_PORT:-4610}:80"]
    networks: [academia-math]

  frontend-administracion:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND: frontend-administracion
        VITE_API_URL: ${VITE_ADMIN_API_URL:-}
        VITE_GATEWAY_PORT: ${VITE_GATEWAY_PORT:-}
        VITE_STUDENT_APP_URL: ${VITE_STUDENT_APP_URL:-}
    depends_on:
      api-gateway: { condition: service_healthy }
    ports: ["${ADMIN_DOCKER_PORT:-4611}:80"]
    networks: [academia-math]

networks:
  academia-math:
    driver: bridge
