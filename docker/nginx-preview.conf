server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://preview-service:4700; proxy_set_header Host $host; }
  location /services/ { proxy_pass http://preview-service:4700; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store" always; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
}
